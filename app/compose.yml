services:
  flask:
    image: ghcr.io/devsanghavi/terraform-aws-infra-api:latest
    container_name: terraform-aws-infra-flask
    restart: unless-stopped
    environment:
      APP_ENV: production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: terraform-aws-infra-nginx
    restart: unless-stopped
    depends_on:
      flask:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
